[package]
name = "skillbox-desktop"
version = "0.4.5"
edition = "2021"

[lib]
name = "skillbox_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "skillbox-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
skillbox-core = { path = "../../../crates/skillbox-core" }
skillbox-github = { path = "../../../crates/skillbox-github" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "=2.7.2"
tauri-plugin-updater = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSRunningApplication", "NSWorkspace", "libc"] }
